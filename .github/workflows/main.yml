# Save as: .github/workflows/build-apk.yml
#
# Builds the luci-app-hh4xmodem LuCI app into an OpenWrt .apk (OpenWrt 25.12+
# package format) with the official OpenWrt SDK, then commits the result back
# into the repo.
#
# The app is architecture-independent (LUCI_PKGARCH:=all), so one build on the
# x86/64 SDK produces an apk that installs on any target (e.g. the HH40V/HH41V).
#
# Works whether the app sits in a sub-folder of the repo or IS the repo root:
# the folder is auto-detected by looking for the Makefile that includes luci.mk.

name: Build luci-app-hh4xmodem apk

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'dist/**'   # the committed apk (keep in sync with CI_OUTPUT_DIR)
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # needed to push the apk back to the repo

# A newer push replaces a run that is still building.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# All variables here are prefixed CI_ on purpose: they are visible to the OpenWrt build,
# and names like PKG_NAME / PKG_VERSION would override those of every package it compiles.
env:
  CI_APP_DIR: ""                   # leave empty to auto-detect, or set e.g. "luci-app-hh4xmodem"
  CI_PKG_NAME: luci-app-hh4xmodem
  CI_OUTPUT_DIR: dist              # folder in this repo where the finished .apk is committed
  CI_BASE_VERSION: "1.0"           # apk version = CI_BASE_VERSION.<commits that touched the app>
  CI_OPENWRT_VERSION: "25.12.6"    # OpenWrt release whose SDK is used
  CI_OPENWRT_TARGET: x86/64        # any target works for an arch-independent package

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to count commits for the version

      - name: Locate app folder
        run: |
          set -e
          if [ -n "$CI_APP_DIR" ] && [ -f "$CI_APP_DIR/Makefile" ]; then
            CI_APP_PATH="$CI_APP_DIR"
          else
            # An OpenWrt package Makefile includes rules.mk (or luci.mk, which includes it)
            MK=$(grep -rlE '^[[:space:]]*-?include[[:space:]].*(rules|luci)\.mk' --include=Makefile --exclude-dir=.git --exclude-dir="$CI_OUTPUT_DIR" . | head -n 1 || true)
            if [ -z "$MK" ]; then
              echo "::error::No OpenWrt package Makefile (one that includes rules.mk or luci.mk) found in this repo"
              echo "Makefiles in the repo:"
              find . -name Makefile -not -path './.git/*'
              for f in Makefile build-apk.sh; do
                [ -f "$f" ] && { echo "=================== $f ==================="; cat "$f"; }
              done
              exit 1
            fi
            CI_APP_PATH=$(dirname "$MK")
            CI_APP_PATH=${CI_APP_PATH#./}
          fi
          echo "App folder: $CI_APP_PATH"
          echo "CI_APP_PATH=$CI_APP_PATH" >> "$GITHUB_ENV"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip xsltproc zlib1g-dev zstd wget file

      - name: Work out package version
        run: |
          COUNT=$(git rev-list --count HEAD -- "$CI_APP_PATH" ":(exclude)$CI_OUTPUT_DIR")
          echo "CI_VERSION=${CI_BASE_VERSION}.${COUNT}" >> "$GITHUB_ENV"
          echo "Package version: ${CI_BASE_VERSION}.${COUNT}"

      - name: Download and verify OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/releases/${CI_OPENWRT_VERSION}/targets/${CI_OPENWRT_TARGET}"
          cd "$RUNNER_TEMP"

          curl -fsSL "$BASE_URL/sha256sums" -o sha256sums
          SDK_FILE=$(awk '{ f=$2; sub(/^\*/, "", f); if (f ~ /^openwrt-sdk-.*\.tar\.zst$/) { print f; exit } }' sha256sums)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK found at $BASE_URL - check CI_OPENWRT_VERSION / CI_OPENWRT_TARGET"
            exit 1
          fi
          echo "SDK: $SDK_FILE"

          curl -fSL "$BASE_URL/$SDK_FILE" -o "$SDK_FILE"
          grep -F "$SDK_FILE" sha256sums | sha256sum -c -

          # Exact feed commits the release was built from (keeps dependency sources
          # identical to what OpenWrt's source mirror has).
          curl -fsSL "$BASE_URL/feeds.buildinfo" -o feeds.buildinfo
          echo "Pinned feeds:"; cat feeds.buildinfo

          mkdir sdk
          tar -I zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          rm -f "$SDK_FILE"
          echo "CI_SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Add the app to the SDK's luci feed
        working-directory: ${{ env.CI_SDK_DIR }}
        run: |
          set -e
          cp "$RUNNER_TEMP/feeds.buildinfo" feeds.conf
          ./scripts/feeds update packages luci

          # The app's Makefile has "include ../../luci.mk", which only resolves when the
          # app sits inside the luci feed (feeds/luci/applications/<app>), so put it there.
          DEST="feeds/luci/applications/$CI_PKG_NAME"
          mkdir -p "$DEST"
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude="/$CI_OUTPUT_DIR" \
            "$GITHUB_WORKSPACE/$CI_APP_PATH/" "$DEST/"

          # Give the package a real version. luci.mk would otherwise derive one from the
          # git state of the luci feed, which has nothing to do with this repo.
          # (Skipped when the Makefile sets PKG_VERSION itself or does not use luci.mk.)
          MK="$DEST/Makefile"
          if grep -q '^PKG_VERSION' "$MK"; then
            echo "Makefile sets PKG_VERSION itself - leaving it alone"
          elif grep -qE '^include .*luci\.mk' "$MK"; then
            sed -i -E "s|^(include .*luci\.mk)|PKG_VERSION:=${CI_VERSION}\nPKG_RELEASE:=1\n\n\1|" "$MK"
            grep -q "^PKG_VERSION:=${CI_VERSION}" "$MK" || { echo "::error::Could not set PKG_VERSION in $MK"; exit 1; }
          else
            echo "::warning::Makefile neither sets PKG_VERSION nor includes luci.mk - building with its own version"
          fi

          ./scripts/feeds update -i luci      # re-index so the new package is known
          ./scripts/feeds install "$CI_PKG_NAME" # also installs its dependencies (luci-base, ...)

      - name: Build apk
        working-directory: ${{ env.CI_SDK_DIR }}
        run: |
          make defconfig
          make "package/$CI_PKG_NAME/compile" -j"$(nproc)" || make "package/$CI_PKG_NAME/compile" -j1 V=s

      - name: Collect apk
        working-directory: ${{ env.CI_SDK_DIR }}
        run: |
          set -e
          APK=$(find bin/packages -type f -name "${CI_PKG_NAME}-*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Build finished but no ${CI_PKG_NAME}-*.apk was produced"
            find bin -type f | head -n 50
            exit 1
          fi
          ls -l "$APK"

          mkdir -p "$GITHUB_WORKSPACE/$CI_OUTPUT_DIR"
          rm -f "$GITHUB_WORKSPACE/$CI_OUTPUT_DIR/${CI_PKG_NAME}"-*.apk   # keep only the newest build
          cp "$APK" "$GITHUB_WORKSPACE/$CI_OUTPUT_DIR/"
          echo "CI_APK_NAME=$(basename "$APK")" >> "$GITHUB_ENV"

      - name: Upload apk as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CI_PKG_NAME }}-apk
          path: ${{ env.CI_OUTPUT_DIR }}/${{ env.CI_PKG_NAME }}-*.apk
          if-no-files-found: error

      - name: Commit apk to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "$CI_OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "apk unchanged - nothing to commit"
            exit 0
          fi

          git commit -m "ci: build $CI_APK_NAME [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" \
              && git push origin "HEAD:$GITHUB_REF_NAME" \
              && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "::error::Could not push the apk to $GITHUB_REF_NAME"
          exit 1
