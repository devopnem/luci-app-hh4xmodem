# Save as: .github/workflows/build-apk.yml
#
# Builds the luci-app-hh4xmodem LuCI app into an OpenWrt .apk (OpenWrt 25.12+
# package format) with the official OpenWrt SDK, then commits the result back
# into the repo.
#
# The app is architecture-independent (LUCI_PKGARCH:=all), so one build on the
# x86/64 SDK produces an apk that installs on any target (e.g. the HH40V/HH41V).
#
# Works whether the app sits in a sub-folder of the repo or IS the repo root:
# the folder is auto-detected by looking for the Makefile that includes luci.mk.

name: Build luci-app-hh4xmodem apk

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'dist/**'   # the committed apk (keep in sync with OUTPUT_DIR)
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # needed to push the apk back to the repo

# A newer push replaces a run that is still building.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: ""                   # leave empty to auto-detect, or set e.g. "luci-app-hh4xmodem"
  PKG_NAME: luci-app-hh4xmodem
  OUTPUT_DIR: dist              # folder in this repo where the finished .apk is committed
  BASE_VERSION: "1.0"           # apk version = BASE_VERSION.<commits that touched the app>
  OPENWRT_VERSION: "25.12.6"    # OpenWrt release whose SDK is used
  OPENWRT_TARGET: x86/64        # any target works for an arch-independent package

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to count commits for the version

      - name: Locate app folder
        run: |
          set -e
          if [ -n "$APP_DIR" ] && [ -f "$APP_DIR/Makefile" ]; then
            APP_PATH="$APP_DIR"
          else
            MK=$(grep -rlE '^include .*luci\.mk' --include=Makefile --exclude-dir=.git --exclude-dir="$OUTPUT_DIR" . | head -n 1 || true)
            if [ -z "$MK" ]; then
              echo "::error::No LuCI app Makefile (one that includes luci.mk) found in this repo"
              echo "Makefiles in the repo:"
              find . -name Makefile -not -path './.git/*'
              echo "Top-level contents:"
              ls -la
              exit 1
            fi
            APP_PATH=$(dirname "$MK")
            APP_PATH=${APP_PATH#./}
          fi
          echo "App folder: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip xsltproc zlib1g-dev zstd wget file

      - name: Work out package version
        run: |
          COUNT=$(git rev-list --count HEAD -- "$APP_PATH" ":(exclude)$OUTPUT_DIR")
          echo "PKG_VERSION=${BASE_VERSION}.${COUNT}" >> "$GITHUB_ENV"
          echo "Package version: ${BASE_VERSION}.${COUNT}"

      - name: Download and verify OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          cd "$RUNNER_TEMP"

          curl -fsSL "$BASE_URL/sha256sums" -o sha256sums
          SDK_FILE=$(awk '{ f=$2; sub(/^\*/, "", f); if (f ~ /^openwrt-sdk-.*\.tar\.zst$/) { print f; exit } }' sha256sums)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK found at $BASE_URL - check OPENWRT_VERSION / OPENWRT_TARGET"
            exit 1
          fi
          echo "SDK: $SDK_FILE"

          curl -fSL "$BASE_URL/$SDK_FILE" -o "$SDK_FILE"
          grep -F "$SDK_FILE" sha256sums | sha256sum -c -

          mkdir sdk
          tar -I zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          rm -f "$SDK_FILE"
          echo "SDK_DIR=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"

      - name: Add the app to the SDK's luci feed
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -e
          ./scripts/feeds update packages luci

          # The app's Makefile has "include ../../luci.mk", which only resolves when the
          # app sits inside the luci feed (feeds/luci/applications/<app>), so put it there.
          DEST="feeds/luci/applications/$PKG_NAME"
          mkdir -p "$DEST"
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude="/$OUTPUT_DIR" \
            "$GITHUB_WORKSPACE/$APP_PATH/" "$DEST/"

          # Give the package a real version. luci.mk would otherwise derive one from the
          # git state of the luci feed, which has nothing to do with this repo.
          MK="$DEST/Makefile"
          if ! grep -q '^PKG_VERSION' "$MK"; then
            sed -i "s|^include \.\./\.\./luci\.mk|PKG_VERSION:=${PKG_VERSION}\nPKG_RELEASE:=1\n\n&|" "$MK"
            grep -q "^PKG_VERSION:=${PKG_VERSION}" "$MK" || { echo "::error::Could not set PKG_VERSION in $MK"; exit 1; }
          fi

          ./scripts/feeds update -i luci      # re-index so the new package is known
          ./scripts/feeds install "$PKG_NAME" # also installs its dependencies (luci-base, ...)

      - name: Build apk
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make defconfig
          make "package/$PKG_NAME/compile" -j"$(nproc)" || make "package/$PKG_NAME/compile" -j1 V=s

      - name: Collect apk
        working-directory: ${{ env.SDK_DIR }}
        run: |
          set -e
          APK=$(find bin/packages -type f -name "${PKG_NAME}-*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Build finished but no ${PKG_NAME}-*.apk was produced"
            find bin -type f | head -n 50
            exit 1
          fi
          ls -l "$APK"

          mkdir -p "$GITHUB_WORKSPACE/$OUTPUT_DIR"
          rm -f "$GITHUB_WORKSPACE/$OUTPUT_DIR/${PKG_NAME}"-*.apk   # keep only the newest build
          cp "$APK" "$GITHUB_WORKSPACE/$OUTPUT_DIR/"
          echo "APK_NAME=$(basename "$APK")" >> "$GITHUB_ENV"

      - name: Upload apk as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-apk
          path: ${{ env.OUTPUT_DIR }}/${{ env.PKG_NAME }}-*.apk
          if-no-files-found: error

      - name: Commit apk to the repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "apk unchanged - nothing to commit"
            exit 0
          fi

          git commit -m "ci: build $APK_NAME [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" \
              && git push origin "HEAD:$GITHUB_REF_NAME" \
              && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "::error::Could not push the apk to $GITHUB_REF_NAME"
          exit 1
