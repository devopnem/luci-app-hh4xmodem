name: Build and Release OpenWrt APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout luci-app-hh4xmodem
        uses: actions/checkout@v4

      - name: Build OpenWrt APK via Official SDK Container
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-SNAPSHOT
          PACKAGES: luci-app-hh4xmodem
          V: s

      - name: Collect built APK files
        run: |
          mkdir -p release-artifacts
          find bin/packages/ -name "luci-app-hh4xmodem*.apk" -exec cp {} release-artifacts/ \;
          ls -lh release-artifacts/

      - name: Remove old APK assets from 'latest' release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in $(gh release view latest --json assets -q '.assets[].name'); do
            gh release delete-asset latest "$asset" --yes
          done

      - name: Publish APK to 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (${{ github.sha }})
          body: |
            Automated build from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.
            Commit message: ${{ github.event.head_commit.message }}
          files: release-artifacts/*.apk
          prerelease: true
