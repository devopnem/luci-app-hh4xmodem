name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: 'OpenWrt SDK tag (e.g. openwrt-25.12 or SNAPSHOT)'
        default: 'openwrt-25.12'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OpenWrt APK
        env:
          SDK_TAG: ${{ inputs.openwrt_tag || 'openwrt-25.12' }}
        run: |
          mkdir -p _pkg dist
          chmod 777 dist
          if [ -f Makefile ]; then
            cp -a Makefile htdocs root _pkg/
          else
            cp -a luci-app-hh4xmodem/. _pkg/
          fi
          sed -i 's|include \.\./\.\./luci\.mk|include $(TOPDIR)/feeds/luci/luci.mk|' _pkg/Makefile
          chmod +x _pkg/root/etc/init.d/* _pkg/root/etc/uci-defaults/* _pkg/root/usr/bin/* 2>/dev/null || true

          docker run --rm \
            -v "$PWD/_pkg:/src:ro" \
            -v "$PWD/dist:/out" \
            "ghcr.io/openwrt/sdk:x86_64-${SDK_TAG}" \
            bash -euo pipefail -c '
              [ -x ./setup.sh ] && ./setup.sh
              # Update luci feed only so feeds/luci/luci.mk exists without installing
              # luci-base/lucihttp into package/feeds/ (avoids compiling lua/lucihttp).
              ./scripts/feeds update luci
              cp -a /src package/luci-app-hh4xmodem
              make defconfig
              make package/luci-app-hh4xmodem/compile V=s
              find bin/packages -type f -name "luci-app-hh4xmodem*.apk" -exec cp -v {} /out/ +
            '
          ls -lh dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*.apk
